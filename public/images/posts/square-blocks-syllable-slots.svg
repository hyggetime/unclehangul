<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="Initial, medial, and final slots inside one Hangul syllable frame">
  <rect width="1200" height="480" fill="#F2F2F0"/>
  <text x="80" y="56" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#111111" letter-spacing="0.08em">ONE SYLLABLE FRAME (STATIC)</text>
  <rect x="80" y="88" width="200" height="240" fill="#FFFFFF" stroke="#111111" stroke-width="1"/>
  <text x="180" y="130" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#6B6960">cho (1)</text>
  <text x="180" y="175" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="48" font-weight="800" fill="#111111">N</text>
  <line x1="80" y1="195" x2="280" y2="195" stroke="#D9D9D3" stroke-width="1"/>
  <text x="180" y="228" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#6B6960">jung (1)</text>
  <text x="180" y="268" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="48" font-weight="800" fill="#111111">O</text>
  <line x1="80" y1="288" x2="280" y2="288" stroke="#D9D9D3" stroke-width="1"/>
  <text x="180" y="318" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#6B6960">jong (…1)</text>
  <text x="180" y="358" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="48" font-weight="800" fill="#111111">4</text>
  <text x="380" y="120" font-family="system-ui, sans-serif" font-size="15" fill="#6B6960">Same outer box, different insides:</text>
  <g font-family="Pretendard, sans-serif" font-size="40" font-weight="800" fill="#111111">
    <rect x="380" y="140" width="88" height="88" fill="#EBEBE5" stroke="#D9D9D3" stroke-width="1"/>
    <text x="424" y="198" text-anchor="middle">\</text>
    <rect x="488" y="140" width="88" height="88" fill="#EBEBE5" stroke="#D9D9D3" stroke-width="1"/>
    <text x="532" y="198" text-anchor="middle"></text>
    <rect x="596" y="140" width="88" height="88" fill="#EBEBE5" stroke="#D9D9D3" stroke-width="1"/>
    <text x="640" y="198" text-anchor="middle">Æ</text>
  </g>
  <text x="424" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6B6960">han</text>
  <text x="532" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6B6960">gap</text>
  <text x="640" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6B6960">eop</text>
</svg>
