<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="Hanja square cell and one Hangul syllable in the same em box">
  <rect width="1200" height="560" fill="#F2F2F0"/>
  <text x="600" y="56" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#111111" letter-spacing="0.06em">ONE EM SQUARE · JOSEON PAGE GRID</text>
  <rect x="380" y="100" width="440" height="360" fill="none" stroke="#D9D9D3" stroke-width="1"/>
  <text x="600" y="88" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6B6960">banggwaeja (¹JW) layout habit</text>
  <rect x="460" y="160" width="280" height="280" fill="#EBEBE5" stroke="#D9D9D3" stroke-width="1"/>
  <text x="600" y="310" text-anchor="middle" font-family="Pretendard, serif" font-size="120" font-weight="700" fill="#111111" opacity="0.15">¹</text>
  <text x="600" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#6B6960">Hanja cell (conceptual)</text>
  <path d="M 600 460 L 600 500" stroke="#111111" stroke-width="1" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111111"/>
    </marker>
  </defs>
  <rect x="490" y="510" width="220" height="36" fill="none"/>
  <rect x="520" y="120" width="160" height="160" fill="#FFFFFF" stroke="#111111" stroke-width="1"/>
  <text x="600" y="215" text-anchor="middle" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="72" font-weight="800" fill="#111111">\</text>
  <text x="600" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6B6960">one Hangul syllable</text>
</svg>
